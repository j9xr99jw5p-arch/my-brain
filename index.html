<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Brain</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#121211">
  <meta name="apple-mobile-web-app-title" content="My Brain">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --text: #1b1b1a;
      --muted: #5c5c57;
      --border: #d4d4ce;
      --accent: #2b55c8;
      --accent-text: #ffffff;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121211;
        --surface: #1c1c1a;
        --text: #f0f0eb;
        --muted: #a8a8a1;
        --border: #3a3a36;
        --accent: #8fabff;
        --accent-text: #121211;
        --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { font-size: 16px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.125rem; margin: 28px 0 10px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type="email"], input[type="password"], input[type="url"], textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }
    input[type="file"] { font: inherit; font-size: 1rem; width: 100%; }
    textarea { min-height: 150px; resize: vertical; }
    button {
      font: inherit;
      font-size: 1rem;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .error { color: var(--error); min-height: 1.5em; }
    .muted { color: var(--muted); }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .tabs { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .tabs button { flex: 0 0 auto; min-width: 88px; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    .status { min-height: 1.5em; margin: 14px 0 0; }
    progress { width: 100%; height: 18px; margin-top: 12px; }
    #recent { list-style: none; margin: 0; padding: 0; }
    #recent li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .tag { font-weight: 600; border: 1px solid var(--border); border-radius: 999px; padding: 0 10px; }
    .thought-text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <main>
    <!-- Sign in -->
    <section id="signin-view" hidden>
      <h1>My Brain</h1>
      <form id="signin-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="row"><button type="submit" id="signin-button" class="primary">Sign in</button></div>
        <p id="signin-error" class="error" role="alert"></p>
      </form>
    </section>

    <!-- Brain -->
    <section id="brain-view" hidden>
      <header class="bar">
        <h1>My Brain</h1>
        <button type="button" id="signout-button">Sign out</button>
      </header>

      <div class="tabs" role="tablist" aria-label="Ways to capture">
        <button type="button" role="tab" id="tab-write" aria-controls="panel-write" aria-selected="true">Write</button>
        <button type="button" role="tab" id="tab-link" aria-controls="panel-link" aria-selected="false">Link</button>
        <button type="button" role="tab" id="tab-video" aria-controls="panel-video" aria-selected="false">Video</button>
        <button type="button" role="tab" id="tab-pdf" aria-controls="panel-pdf" aria-selected="false">PDF</button>
      </div>

      <section id="panel-write" role="tabpanel" aria-labelledby="tab-write">
        <label for="note-text">What's on your mind?</label>
        <textarea id="note-text"></textarea>
        <div class="row">
          <button type="button" id="mic-button" aria-pressed="false">🎙️ Speak</button>
          <button type="button" id="note-save" class="primary">Save</button>
        </div>
        <p id="mic-note" class="muted" hidden></p>
      </section>

      <section id="panel-link" role="tabpanel" aria-labelledby="tab-link" hidden>
        <label for="link-url">Web address</label>
        <input id="link-url" type="url" inputmode="url" autocomplete="off" placeholder="https://">
        <div class="row"><button type="button" id="link-save" class="primary">Save</button></div>
      </section>

      <section id="panel-video" role="tabpanel" aria-labelledby="tab-video" hidden>
        <label for="video-url">YouTube link</label>
        <input id="video-url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=">
        <div class="row"><button type="button" id="video-save" class="primary">Save</button></div>
        <div id="transcript-box" hidden>
          <label for="transcript-text">Paste the transcript</label>
          <p class="muted">On YouTube, click …more under the video, then Show transcript. Select the transcript, copy it and paste it here.</p>
          <textarea id="transcript-text"></textarea>
          <div class="row"><button type="button" id="transcript-save" class="primary">Save</button></div>
        </div>
      </section>

      <section id="panel-pdf" role="tabpanel" aria-labelledby="tab-pdf" hidden>
        <label for="pdf-file">Choose a PDF</label>
        <input id="pdf-file" type="file" accept="application/pdf,.pdf">
        <progress id="pdf-progress" value="0" max="100" aria-label="Reading progress"></progress>
        <label for="pdf-text">Text from the PDF</label>
        <textarea id="pdf-text" readonly></textarea>
        <div class="row"><button type="button" id="pdf-save" class="primary" disabled>Save</button></div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <h2>Recent</h2>
      <ul id="recent"></ul>

      <footer>
        <button type="button" id="lock-check">Lock check</button>
        <p id="lock-result" aria-live="polite"></p>
      </footer>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
