<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Brain</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #d8d8dc;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --danger: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1f;
        --text: #f2f2f4;
        --muted: #a0a0a8;
        --border: #34343a;
        --accent: #5b8cff;
        --accent-text: #0b0b0d;
        --danger: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    [hidden] { display: none !important; }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.1rem; margin: 32px 0 8px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, textarea, button { font: inherit; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .full { width: 100%; margin-top: 16px; }
    .note { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); }
    .error { color: var(--danger); }
    .bad { color: var(--danger); font-weight: 700; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    li time { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    li p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <main>
    <!-- Sign-in screen. There is no sign-up link: your account was made in Supabase. -->
    <section id="signin-view" hidden>
      <h1>My Brain</h1>
      <form id="signin-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="signin-button" type="submit" class="full">Sign in</button>
        <p id="signin-error" class="note error" role="alert"></p>
      </form>
    </section>

    <!-- Brain screen, shown only when you're signed in. -->
    <section id="brain-view" hidden>
      <header class="row">
        <h1>My Brain</h1>
        <button id="signout-button" type="button" class="secondary">Sign out</button>
      </header>

      <label for="thought">What's on your mind?</label>
      <textarea id="thought" placeholder="Type a thought, then Save (or Cmd/Ctrl + Enter)"></textarea>
      <button id="save-button" type="button" class="full">Save</button>
      <p id="save-status" class="note" role="status"></p>

      <h2>Recent</h2>
      <ul id="recent-list"></ul>
      <p id="recent-status" class="note"></p>

      <footer>
        <button id="lock-button" type="button" class="secondary">Lock check</button>
        <p id="lock-result" class="note" role="status"></p>
      </footer>
    </section>
  </main>

  <!-- Load order matters: Supabase's helper first, then your settings, then the app. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
